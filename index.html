<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca Virtual</title>
<meta name="description" content="Leyes, códigos, normas y manuales para consultar en el teléfono, también sin internet.">
<meta name="theme-color" content="#0B1226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --azul:#1D4ED8; --azul-claro:#60A5FA; --amarillo:#FACC15; --tinta:#0B1226;
  --fondo:#0B1226; --tarjeta:#121B36; --tarjeta2:#1A2547; --borde:#22305A; --texto:#EEF2FF; --suave:#C9D3F0; --tenue:#94A3C7;
  --celeste:#1A2547; --peligro:#F87171; --ok:#34D399; --sombra:none; --lector:#020617;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.45 'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Encabezado */
header{padding:calc(env(safe-area-inset-top) + 18px) 16px 6px;max-width:720px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px}
.marca .logo{width:40px;height:40px;flex:none}
.marca .nombre-app{flex:1;min-width:0;display:flex;flex-direction:column}
.marca .saludo{font-size:12px;color:var(--tenue)}
.marca h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icono{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--texto)}
header .btn-icono{border-radius:14px;border:1px solid var(--borde);background:var(--tarjeta);flex:none}
header .btn-icono.activo{background:var(--amarillo);border-color:var(--amarillo);color:var(--tinta)}
.buscador{margin:16px 0 0;position:relative;display:flex;align-items:center;height:54px;border-radius:27px;background:var(--tarjeta);border:1px solid var(--borde);padding:0 7px 0 16px;gap:8px}
.buscador:focus-within{border-color:var(--amarillo)}
.buscador svg.lupa{flex:none;color:var(--tenue)}
.buscador input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--texto);font-size:16px;outline:none}
.buscador input::placeholder{color:var(--tenue)}
.buscador .limpiar{width:36px;height:36px;color:var(--tenue)}
.buscador .ir{flex:none;height:40px;padding:0 16px;border:0;border-radius:20px;background:var(--amarillo);color:var(--tinta);font-weight:600;font-size:14px}

/* Barra inferior */
.barra-inf{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(11,18,38,.96);border-top:1px solid var(--borde);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));backdrop-filter:blur(8px)}
.barra-inf button{border:0;background:none;color:var(--tenue);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;min-height:50px;justify-content:center}
.barra-inf button[aria-current="page"]{color:var(--amarillo);font-weight:600}

/* Inicio: seguir leyendo y bloques */
.seguir{width:100%;border:0;border-radius:18px;padding:14px 14px 14px 16px;background:var(--tarjeta);display:flex;align-items:center;gap:14px;text-align:left;margin-top:16px}
.seguir .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.seguir .eti{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--tenue)}
.seguir .tit{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seguir .avance{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tenue)}
.seguir .progreso{flex:1;height:5px;border-radius:3px;background:var(--borde);overflow:hidden}
.seguir .progreso span{display:block;height:5px;background:var(--amarillo)}
.seguir .play{width:44px;height:44px;border-radius:22px;background:var(--amarillo);color:var(--tinta);display:flex;align-items:center;justify-content:center;flex:none}
.bloques{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bloque{position:relative;overflow:hidden;min-height:96px;border:0;border-radius:20px;background:var(--tarjeta);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left}
.bloque:active{filter:brightness(1.15)}
.bloque .franja{position:absolute;left:0;top:0;bottom:0;width:5px}
.bloque .ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.bloque .pie-b{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%}
.bloque .nom{font-size:15px;font-weight:600}
.bloque .cnt{font-size:12px;color:var(--tenue);white-space:nowrap}
.bloque.grande{grid-column:span 2;min-height:62px;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:12px 16px 12px 14px;background:var(--azul);color:#fff}
.bloque.grande .ico{background:rgba(255,255,255,.16);color:#fff}
.bloque.grande .txt-g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bloque.grande .cnt,.bloque.grande .eti{color:#DBEAFE}
.bloque.grande .eti{font-size:13px;font-weight:600}
.bloque.grande .sub{font-size:15px;font-weight:600;line-height:1.25}
.bloque.grande .eti{font-size:12px;font-weight:400}
.bloque.mis{background:transparent;border:1px dashed var(--borde);color:var(--tenue)}
.novedad{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--tarjeta);border-radius:14px;padding:12px 14px;text-align:left}
.novedad .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:6px;background:#14532D;color:#BBF7D0}
.novedad .tag.act{background:#1E3A8A;color:#BFDBFE}
.novedad .t{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.novedad .f{font-size:12px;color:var(--tenue)}

/* Pantalla de un área */
.heroe{position:relative;overflow:hidden;margin:14px 0 4px;border-radius:22px;background:var(--tarjeta);padding:12px 12px 16px}
.heroe .franja{position:absolute;left:0;top:0;bottom:0;width:6px}
.heroe .fila{display:flex;align-items:center;gap:8px}
.heroe .fila .btn-icono{background:var(--tarjeta2);border-radius:14px}
.heroe .datos{display:flex;align-items:center;gap:14px;padding:10px 6px 0}
.heroe .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.heroe h2{margin:0;font-size:25px;font-weight:700;letter-spacing:-.5px}
.heroe .cnt{font-size:13px;color:var(--tenue)}
h2.vista{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:18px 4px 4px}
p.explica{margin:0 4px 12px;color:var(--tenue);font-size:14px}

main{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);margin:20px 4px 8px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:8px}

/* Tarjeta de documento */
.doc{display:flex;flex-direction:column;background:var(--tarjeta);border:0;border-radius:18px;padding:6px 4px 2px}
.doc .abrir{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px 2px;border-radius:12px}
.doc .abrir:active{background:var(--celeste)}
.pdf-ico{flex:none;width:40px;height:48px;border-radius:8px;background:var(--celeste);color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.doc .txt{min-width:0}
.doc .titulo{display:block;font-weight:600;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.doc-pie{display:flex;align-items:center;gap:4px;min-height:44px}
.meta-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0 0 0 12px;text-align:left;align-self:stretch}
.tipo{flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--tinta);background:var(--amarillo);border-radius:6px;padding:3px 6px}
.tipo.web{background:transparent;border:1px dashed var(--borde);color:var(--tenue)}
.acciones{display:flex;flex:none}
.doc .meta{font-size:13px;color:var(--tenue);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .meta .ok{color:var(--ok);font-weight:600}
.doc .meta .nuevo{color:var(--azul-claro);font-weight:600}
.doc .btn-icono{color:var(--tenue)}
.doc .btn-icono[aria-pressed="true"]{color:var(--amarillo)}
.doc .btn-icono.bajado{color:var(--ok)}
.doc .btn-icono:active{background:var(--celeste)}
.doc .btn-icono:disabled{opacity:.5}

header .btn-icono.activo{background:#FACC15;color:#0F172A}
body.editando main::before{content:'Modo edición · toque ✎ arriba para terminar';display:block;margin:12px 0 0;padding:8px 12px;border-radius:12px;background:var(--amarillo);color:var(--tinta);font-size:14px;font-weight:600;text-align:center}
#hoja{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.hoja-fondo{position:absolute;inset:0;background:rgba(2,6,23,.55)}
.hoja-caja{position:relative;width:100%;max-width:560px;background:var(--tarjeta);border-radius:20px 20px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-height:80vh;overflow:auto}
.hoja-titulo{font-size:14px;color:var(--tenue);font-weight:600;text-align:center;padding:6px 12px 10px;border-bottom:1px solid var(--borde)}
#hojaOpciones{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hoja-op{min-height:52px;border:0;border-radius:14px;background:var(--fondo);font-size:17px;font-weight:600;color:var(--azul-claro)}
.hoja-op:active{background:var(--celeste)}
.hoja-op.peligro{color:var(--peligro)}
.hoja-op.cancelar{color:var(--texto);margin-top:4px}
.doc .btn-icono.mas{width:36px}
.grupos{display:flex;flex-direction:column;gap:8px}
.grupo{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.grupo-cab{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px 0 16px;background:none;border:0;text-align:left}
.grupo-cab:active{background:var(--celeste)}
.grupo-nombre{flex:1;font-size:17px;font-weight:700}
.grupo-cuenta{font-size:14px;color:var(--tenue);font-weight:600}
.grupo-cab svg{color:var(--tenue);transition:transform .15s}
.grupo.abierto .grupo-cab svg{transform:rotate(90deg)}
.grupo.abierto .grupo-cab{border-bottom:1px solid var(--borde)}
.grupo-cuerpo{padding:8px 6px 12px;background:var(--fondo)}
.grupo-cuerpo .fila-accion{margin:4px 0 8px}
.doc.pendiente{background:transparent;box-shadow:none;border-style:dashed}
.pdf-ico.web{background:transparent;border:1.5px dashed var(--borde);color:var(--tenue);font-size:10px}
.doc .btn-icono.subir{color:var(--amarillo)}
h3.subseccion{font-size:13px;color:var(--tenue);font-weight:600;margin:14px 4px 8px}
.panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.panel p{margin:0;color:var(--suave);font-size:15px}
.panel .url{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--texto);word-break:break-all;background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;align-self:stretch}
.panel input{align-self:stretch;height:48px;border:1px solid var(--borde);border-radius:12px;padding:0 12px;background:var(--fondo);font-size:16px}
.panel .fila{display:flex;gap:8px;flex-wrap:wrap}
.panel .ok{color:var(--ok)}
.etiqueta{font-size:14px;font-weight:600;color:var(--texto)}
.aviso-error{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin:8px 0}
.aviso-error p{margin:0;color:var(--peligro);font-size:14px}
.vacio{text-align:center;color:var(--suave);padding:40px 16px}
.vacio strong{display:block;color:var(--texto);font-size:18px;margin-bottom:6px}
.vacio code{background:var(--celeste);padding:2px 6px;border-radius:6px;font-size:14px}
.btn{height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--amarillo);color:var(--tinta);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--tarjeta);color:var(--texto);border:1px solid var(--borde)}
.fila-accion{display:flex;justify-content:center;margin:12px 0 4px}

/* Resultados dentro del texto */
.hit{display:block;width:100%;text-align:left;background:var(--tarjeta);border:0;border-radius:16px;padding:12px 14px}
.hit:active{background:var(--celeste)}
.hit .de{font-size:13px;color:var(--tenue);font-weight:600}
.hit .frag{font-size:15px;margin-top:4px;color:var(--suave)}
.hit mark{background:var(--amarillo);color:var(--tinta);border-radius:3px;padding:0 1px}
.nota{font-size:13px;color:var(--tenue);margin:8px 4px}

.aviso{max-width:720px;margin:12px auto 0;padding:0 16px}
.aviso div{display:flex;gap:12px;align-items:center;background:var(--celeste);color:var(--texto);border-radius:14px;padding:10px 8px 10px 14px;font-size:14px}
.aviso p{margin:0;flex:1}

/* Lector */
#lector{position:fixed;inset:0;z-index:20;background:var(--lector);display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:calc(env(safe-area-inset-top) + 4px) 4px 4px}
.barra .btn-icono{color:var(--texto)}
.barra .nombre{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar-doc{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:6px 4px 6px 12px}
.buscar-doc input{flex:1;min-width:0;height:40px;border:1px solid var(--borde);border-radius:10px;padding:0 12px;background:var(--fondo)}
.buscar-doc .cuenta{font-size:13px;color:var(--tenue);min-width:64px;text-align:center}
#paginas{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;padding:12px 8px}
.pagina{margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);position:relative;max-width:none}
.pagina canvas{display:block;width:100%;height:auto;position:relative;z-index:1;background:#fff}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.pagina .num{position:absolute;inset:auto 0 50% 0;text-align:center;color:#94A3B8;font-size:14px}
.pie{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--tarjeta);border-top:1px solid var(--borde);padding:4px 8px calc(env(safe-area-inset-bottom) + 4px)}
.pie .btn-icono{color:var(--texto)}
.pie .pag{min-width:110px;height:40px;border:1px solid var(--borde);border-radius:10px;background:var(--fondo);font-size:15px;font-weight:600}
.cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:15px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#EEF2FF;color:#0B1226 !important;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>

<header>
  <div class="marca">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#1D4ED8"/><rect x="20" y="30" width="10" height="46.5" rx="2" fill="#FFFFFF"/><rect x="33" y="24" width="10" height="52.5" rx="2" fill="#BFDBFE"/><rect x="46" y="34" width="10" height="42.5" rx="2" fill="#FFFFFF"/><rect x="59" y="32.5" width="10" height="44" rx="2" fill="#BFDBFE" transform="rotate(14 59 76.5)"/><path d="M16 78 H84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><circle cx="73" cy="38" r="9" fill="#1D4ED8" stroke="#FACC15" stroke-width="4"/><path d="M79.5 44.5 L86 51" stroke="#FACC15" stroke-width="4.5" stroke-linecap="round"/></svg>
    <div class="nombre-app"><span class="saludo" id="saludo">Bienvenido</span><h1>Biblioteca Virtual</h1></div>
    <button class="btn-icono oculto" id="btnInstalar" aria-label="Instalar la app">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <button class="btn-icono oculto" id="btnEditar" aria-label="Modo edición" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
    </button>
    <button class="btn-icono" id="btnAjustes" aria-label="Compartir y ajustes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
    </button>
  </div>
  <form class="buscador" role="search" id="formBuscar">
    <label for="q" class="sr">Buscar en la biblioteca</label>
    <svg class="lupa" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Ley, artículo o palabra" autocomplete="off" enterkeyhint="search">
    <button type="button" class="btn-icono limpiar oculto" id="btnLimpiar" aria-label="Borrar búsqueda">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="submit" class="ir">Buscar</button>
  </form>
</header>

<div class="aviso oculto" id="avisoIos"><div>
  <p>Para instalarla: toque <strong>Compartir</strong> y luego <strong>Agregar a inicio</strong>.</p>
  <button class="btn-icono" id="cerrarAviso" aria-label="Cerrar aviso"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div></div>

<main id="contenido" aria-live="polite"></main>
<nav class="barra-inf" id="barraInf" aria-label="Secciones"></nav>

<section id="lector" class="oculto" aria-label="Lector de documento">
  <div class="barra">
    <button class="btn-icono" id="lecCerrar" aria-label="Volver a la biblioteca">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="nombre" id="lecTitulo"></div>
    <button class="btn-icono" id="lecCompartir" aria-label="Compartir este documento">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>

const rutaApi = (path) => '/contents/' + path.split('/').map(encodeURIComponent).join('/');
async function shaDe(path) {
  const r = await gh(rutaApi(path) + '?ref=' + RAMA);
  if (r.status === 401) throw new Error('La clave venció o no es válida. Actívela de nuevo en Ajustes.');

}
async function borrarEnGithub(path, mensaje) {

  if (!r.ok) throw new Error('GitHub no permitió borrar el archivo (' + r.status + ').');
}

async function moverDoc(d, area, nombreNuevo) {
  const nombre = nombreNuevo || d.path.split('/').pop();
  const carpeta = nombreNuevo ? d.path.split('/').slice(0, -1).join('/') : 'documentos/' + area;
  const destino = carpeta + '/' + nombre;

  E.ocupado[d.id] = nombreNuevo ? 'Cambiando nombre…' : 'Moviendo a ' + etiquetaArea(area) + '…'; pintar();

    const existe = await shaDe(destino);
    if (existe && !confirm('Ya hay un archivo con ese nombre en ' + etiquetaArea(nombreNuevo ? d.area : area) + '. ¿Reemplazarlo?')) throw new Error('');
    const blob = await (await (async () => { const c = await caches.open(DOCS_CACHE); return (await c.match(absoluta(d.url))) || fetch(d.url); })()).blob();
    const body = { message: (nombreNuevo ? 'Renombrar a ' + nombre : 'Mover ' + nombre + ' a ' + area) + ' desde la app', content: await base64(blob), branch: RAMA };
    if (existe) body.sha = existe;
    const r = await gh(rutaApi(destino), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('GitHub no aceptó el archivo (' + r.status + ').');
    const j = await r.json();
    await borrarEnGithub(d.path, 'Quitar ' + nombre + ' de su ubicación anterior');
    const nuevo = docDeRepo(destino, d.size, j.content && j.content.sha);
    await trasladarDatos(d, nuevo);
    const c = await caches.open(DOCS_CACHE);
    if (nuevo.id in E.bajados) await c.put(nuevo.url, new Response(blob, { headers: { 'Content-Type': 'application/pdf' } }));
    await c.delete(absoluta(d.url));

    guardar('bv-lista', { t: Date.now(), docs: E.docs, vacio: false });

    if (e.message) aviso(navigator.onLine ? e.message : 'Sin conexión. Intente cuando tenga internet.', 6000);
  }

}

function base64(file) {
  return new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1]); fr.onerror = () => mal(fr.error); fr.readAsDataURL(file); });
}
async function subirPdf(file, area, archivo, clave) {

    if (ex.ok) sha = (await ex.json()).sha;
    const body = { message: 'Agregar ' + nombre + ' desde la app', content: await base64(file), branch: RAMA };
    if (sha) body.sha = sha;
    const r = await gh(ruta, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) throw new Error('La clave venció o no es válida. Actívela de nuevo en Ajustes.');
    if (!r.ok) throw new Error('GitHub no aceptó el archivo (' + r.status + ').');
    const j = await r.json();

    E.docs = E.docs.filter((x) => x.id !== d.id).concat(d);

    // Queda guardado en este teléfono y listo para buscar dentro del texto.

    E.bajados[d.id] = d.sha || true; guardar('bv-bajados', E.bajados);
    if (pdfLib()) { E.ocupado[k] = 'Preparando búsqueda…'; pintar(); await indexar(d.id, await file.arrayBuffer()); }

  } catch (e) {
    aviso(navigator.onLine ? (e.message || 'No se pudo subir.') : 'Sin conexión. Intente cuando tenga internet.', 6000);
  }

}

/* ================= Búsqueda general ================= */
function fragmento(orig, pleg, i, n) {
  const a = Math.max(0, i - 60), b = Math.min(orig.length, i + n + 80);
  return el('div', { class: 'frag' }, (a > 0 ? '…' : '') + orig.slice(a, i).replace(/\s+/g, ' '), el('mark', null, orig.slice(i, i + n)), orig.slice(i + n, b).replace(/\s+/g, ' ') + (b < orig.length ? '…' : ''));
}
function pintarBusqueda(m) {
  const q = plegar(E.q.trim().replace(/\s+/g, ' '));
  const palabras = q.split(' ');
  const enTitulo = ordenar(todos().filter((d) => { const t = plegar(d.titulo + ' ' + etiquetaArea(d.area)); return palabras.every((w) => t.includes(w)); }));
  m.append(el('h2', { class: 'vista' }, 'Resultados'));
  if (enTitulo.length) m.append(el('h2', { class: 'seccion' }, 'Documentos · ' + enTitulo.length), el('div', { class: 'lista' }, enTitulo.map(tarjeta)));
  const pendTitulo = pendientes().filter((c) => { const t = plegar(c.titulo + ' ' + etiquetaArea(c.area)); return palabras.every((w) => t.includes(w)); });
  if (pendTitulo.length) m.append(el('h2', { class: 'seccion' }, 'Por agregar · ' + pendTitulo.length), el('div', { class: 'lista' }, pendTitulo.map(tarjetaPendiente)));

  // Primero las leyes y códigos; luego libros y documentos propios. Hasta 3 pasajes por documento.
  const prioridad = (d) => { const i = ['codigos', 'laboral', 'portuario', 'pecuario'].indexOf(d.area); return i < 0 ? 9 : i; };
  const orden = todos().slice().sort((a, b) => prioridad(a) - prioridad(b) || a.titulo.localeCompare(b.titulo, 'es', { numeric: true }));
  const grupos = []; let total = 0;
  for (const d of orden) {
    const tx = textoDe(d); if (!tx) continue;
    const h = []; let n = 0;
    tx.plegadas.forEach((pg, k) => {
      let i = pg.indexOf(q);
      while (i !== -1) { n++; if (h.length < 3) h.push({ p: k + 1, frag: fragmento(tx.pages[k], pg, i, q.length) }); i = pg.indexOf(q, i + q.length); }
    });
    if (n) { grupos.push({ d, h, n }); total += n; }
  }
  const hits = grupos;
  if (grupos.length) {
    m.append(el('h2', { class: 'seccion' }, 'Dentro del texto · ' + total + ' en ' + grupos.length + (grupos.length === 1 ? ' documento' : ' documentos')));
    const caja = el('div', { class: 'lista' });
    for (const g of grupos.slice(0, 40)) {
      g.h.forEach((x, j) => caja.append(el('button', { class: 'hit', onclick: () => abrir(g.d, x.p, E.q.trim()) },
        el('div', { class: 'de' }, g.d.titulo + ' · pág. ' + x.p + (j === 0 && g.n > g.h.length ? ' · ' + g.n + ' coincidencias' : '')), x.frag)));
    }
    m.append(caja);
  }
  if (!enTitulo.length && !hits.length && !pendTitulo.length) m.append(vacio('Sin resultados para “' + E.q.trim() + '”'));
  const sinTexto = todos().filter((d) => !textoDe(d)).length;
  if (!E.indice.size) m.append(el('p', { class: 'nota' }, navigator.onLine ? 'Preparando la búsqueda dentro del texto de todos los documentos…' : 'Conéctese una vez a internet para buscar dentro del texto de todos los documentos.'));
  else if (sinTexto) m.append(el('p', { class: 'nota' }, sinTexto + (sinTexto === 1 ? ' documento recién subido todavía no está' : ' documentos recién subidos todavía no están') + ' en la búsqueda; quedan listos en unos minutos.'));
}

/* ================= Texto para buscar ================= */
async function extraerTexto(pdf, progreso) {
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    pages.push(tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' '));
    if (progreso) progreso(i, pdf.numPages);
  }
  return pages;
}
async function indexar(id, buf, progreso) {
  const pdf = await pdfLib().getDocument({ data: buf }).promise;
  const pages = await extraerTexto(pdf, progreso);
  cerrarPdf(pdf);
  await idbPut('texto', { id, pages });
  E.textos.set(id, { pages, plegadas: pages.map(plegar) });
  return pages;
}

  if (!confirm('¿Eliminar “' + d.titulo + '” de este teléfono?')) return;
  await idbDel('archivos', d.id); await idbDel('texto', d.id); E.textos.delete(d.id);
  E.favs.delete(d.id); guardar('bv-favs', [...E.favs]);
  delete E.ultimo[d.id]; guardar('bv-ultimo', E.ultimo);
  await cargarLocales(); pintar();
}

/* ================= Lector ================= */
const R = { doc: null, pdf: null, paginas: [], zoom: 1, actual: 1, obs: null, hits: [], hit: -1, textos: null, abierto: false, gen: 0 };
const ZOOMS = [1, 1.5, 2, 3];

async function datosDoc(d) {
  if (d.local) { const a = await idbGet('archivos', d.id); if (!a) throw new Error('No se encontró el archivo.'); return a.blob.arrayBuffer(); }
  const c = await caches.open(DOCS_CACHE); const hit = await c.match(absoluta(d.url));
  if (hit) return hit.arrayBuffer();
  const res = await fetch(d.url);
  if (!res.ok) throw new Error('No se pudo abrir (' + res.status + ').');
  return res.arrayBuffer();
}
async function abrir(d, pagina, buscar) {
  if (!pdfLib()) return aviso('El lector necesita internet la primera vez. Conéctese y vuelva a intentarlo.');
  cerrarLector(true);
  const gen = ++R.gen;
  R.doc = d; R.blob = null; R.zoom = 1; R.hits = []; R.hit = -1; R.textos = textoDe(d) ? textoDe(d).pages : null;
  $('lecTitulo').textContent = d.titulo; pintarFavLector();
  $('lecBarraBuscar').classList.add('oculto'); $('lecQ').value = ''; $('lecCuenta').textContent = '';
  const cont = $('paginas'); cont.textContent = ''; cont.append(el('div', { class: 'cargando' }, 'Abriendo…'));
  $('lector').classList.remove('oculto'); document.body.style.overflow = 'hidden';
  if (!R.abierto) { history.pushState({ lector: 1 }, ''); R.abierto = true; }
  try {
    const buf = await datosDoc(d);
    R.blob = new Blob([buf], { type: 'application/pdf' }); // copia para compartir (el lector se queda con el original)
    const pdf = await pdfLib().getDocument({ data: buf }).promise;
    if (gen !== R.gen) { cerrarPdf(pdf); return; }
    R.pdf = pdf;
    const p1 = await pdf.getPage(1); const v = p1.getViewport({ scale: 1 });
    cont.textContent = '';
    R.paginas = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const div = el('div', { class: 'pagina', 'data-n': i, style: 'aspect-ratio:' + v.width + '/' + v.height }, el('span', { class: 'num' }, String(i)));
      R.paginas.push(div); cont.append(div);
    }
    aplicarZoom();
    R.obs = new IntersectionObserver(alVer, { root: cont, rootMargin: '1200px 0px' });
    R.paginas.forEach((p) => R.obs.observe(p));
    const ir = pagina || (E.ultimo[d.id] && E.ultimo[d.id].p) || 1;
    requestAnimationFrame(() => irA(ir, true));
    actualizarPag();
    if (buscar) { $('lecBarraBuscar').classList.remove('oculto'); $('lecQ').value = buscar; buscarEnDoc(pagina); }
  } catch (e) {
    cont.textContent = '';
    if (d.externo && navigator.onLine) {
      cont.append(el('div', { class: 'cargando', style: 'flex-direction:column;gap:14px;padding:24px;text-align:center' },
        el('span', null, 'La página que publica esta guía no permite mostrarla dentro de la app.'),
        el('button', { class: 'btn', onclick: () => window.open(d.url, '_blank', 'noopener') }, svg(ICO.externo), 'Abrir el PDF')));
      return;
    }
    cont.append(el('div', { class: 'cargando' }, navigator.onLine ? (e.message || 'No se pudo abrir el documento.') : 'Sin conexión. Guarde el documento en el teléfono para leerlo sin internet.'));
  }
}
function alVer(entradas) {
  for (const en of entradas) {
    const div = en.target;
    if (en.isIntersecting) { if (!div.dataset.ok) dibujar(div); }
    else if (div.dataset.ok) { const cv = div.querySelector('canvas'); if (cv) { cv.width = cv.height = 0; cv.remove(); } delete div.dataset.ok; }
  }
}
async function dibujar(div) {
  const n = +div.dataset.n; div.dataset.ok = '1'; const gen = R.gen, zoom = R.zoom;
  try {
    const pg = await R.pdf.getPage(n);
    if (gen !== R.gen || zoom !== R.zoom || !div.dataset.ok) return;
    const base = pg.getViewport({ scale: 1 });
    div.style.aspectRatio = base.width + '/' + base.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const escala = Math.min((div.clientWidth * dpr) / base.width, 4096 / base.width);
    const vp = pg.getViewport({ scale: escala });
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (gen !== R.gen || zoom !== R.zoom || !div.dataset.ok) return;
    const viejo = div.querySelector('canvas'); if (viejo) viejo.remove();
    div.append(cv);
  } catch (e) { delete div.dataset.ok; }
}
function aplicarZoom() {
  const ancho = $('paginas').clientWidth - 16;
  R.paginas.forEach((p) => { p.style.width = Math.round(ancho * R.zoom) + 'px'; });
}
function cambiarZoom(dir) {
  const i = ZOOMS.indexOf(R.zoom) + dir; if (i < 0 || i >= ZOOMS.length || !R.pdf) return;
  const pag = R.actual; R.zoom = ZOOMS[i];
  R.paginas.forEach((p) => { const cv = p.querySelector('canvas'); if (cv) { cv.width = cv.height = 0; cv.remove(); } delete p.dataset.ok; R.obs.unobserve(p); });
  aplicarZoom(); irA(pag, true);
  R.paginas.forEach((p) => R.obs.observe(p));
}
function irA(n, instant) {
  const p = R.paginas[Math.max(1, Math.min(n, R.paginas.length)) - 1]; if (!p) return;
  $('paginas').scrollTo({ top: p.offsetTop - 8, behavior: instant ? 'auto' : 'smooth' });
}
function paginaVisible() {
  const c = $('paginas'); const y = c.scrollTop + c.clientHeight / 3;
  let lo = 0, hi = R.paginas.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (R.paginas[mid].offsetTop <= y) lo = mid; else hi = mid - 1; }
  return lo + 1;
}
function actualizarPag() {
  if (!R.pdf) return;
  R.actual = paginaVisible();
  $('lecPag').textContent = R.actual + ' / ' + R.pdf.numPages;
  E.ultimo[R.doc.id] = { p: R.actual, n: R.pdf.numPages, t: Date.now() }; guardar('bv-ultimo', E.ultimo);
}
let rafPag = 0;
$('paginas').addEventListener('scroll', () => { if (!rafPag) rafPag = requestAnimationFrame(() => { rafPag = 0; actualizarPag(); }); }, { passive: true });
function cerrarLector(silencioso) {
  R.gen++;
  if (R.obs) R.obs.disconnect(); R.obs = null;
  R.paginas.forEach((p) => { const cv = p.querySelector('canvas'); if (cv) cv.width = cv.height = 0; });
  R.paginas = [];
  if (R.pdf) cerrarPdf(R.pdf); R.pdf = null;
  if (!silencioso) { $('lector').classList.add('oculto'); document.body.style.overflow = ''; R.doc = null; pintar(); }
}
$('lecCerrar').addEventListener('click', () => { if (R.abierto) history.back(); else cerrarLector(); });
window.addEventListener('popstate', () => { if (R.abierto) { R.abierto = false; cerrarLector(); } });
$('zoomMas').addEventListener('click', () => cambiarZoom(1));
$('zoomMenos').addEventListener('click', () => cambiarZoom(-1));
$('lecPag').addEventListener('click', () => {
  if (!R.pdf) return;
  const v = prompt('Ir a la página (1 a ' + R.pdf.numPages + '):', R.actual);
  const n = parseInt(v, 10); if (n) irA(n);
});
function pintarFavLector() {
  const b = $('lecFav'); const on = R.doc && E.favs.has(R.doc.id);
  b.setAttribute('aria-pressed', String(!!on)); b.setAttribute('aria-label', on ? 'Quitar de favoritos' : 'Agregar a favoritos');
  b.querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none'); b.style.color = on ? '#FACC15' : '';
}
$('lecFav').addEventListener('click', () => R.doc && alternarFav(R.doc.id));
// Compartir el PDF abierto. Se llama sin esperas para que el iPhone muestre el menú de compartir.
$('lecCompartir').addEventListener('click', () => {
  const d = R.doc; if (!d) return;
  if (!R.blob) return aviso('Espere a que termine de abrir el documento.');
  const nombre = d.path ? d.path.split('/').pop() : limpiarNombre(d.titulo);
  const archivo = new File([R.blob], nombre, { type: 'application/pdf' });
  const texto = d.titulo + ' · Biblioteca Virtual';
  let p;
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) p = navigator.share({ files: [archivo], title: texto });
  else if (navigator.share) p = navigator.share({ title: texto, text: texto, url: d.local ? URL_APP() : d.url });
  else {
    const a = el('a', { href: URL.createObjectURL(archivo), download: nombre }); document.body.append(a); a.click(); a.remove();
    return;
  }
  p.catch((e) => { if (e && e.name !== 'AbortError') aviso('No se pudo compartir. Intente de nuevo.'); });
});
$('lecBuscar').addEventListener('click', () => {
  const f = $('lecBarraBuscar'); f.classList.toggle('oculto');
  if (!f.classList.contains('oculto')) $('lecQ').focus();
});
async function buscarEnDoc(desdePagina) {
  const q = plegar($('lecQ').value.trim().replace(/\s+/g, ' '));
  if (!q || !R.pdf) { $('lecCuenta').textContent = ''; R.hits = []; return; }
  if (!R.textos) { $('lecCuenta').textContent = 'Buscando…'; const gen = R.gen; const t = await extraerTexto(R.pdf); if (gen !== R.gen) return; R.textos = t; }
  R.hits = [];
  R.textos.forEach((t, k) => { if (plegar(t).includes(q)) R.hits.push(k + 1); });
  if (!R.hits.length) { $('lecCuenta').textContent = 'Sin resultados'; return; }
  const ref = desdePagina || R.actual;
  R.hit = Math.max(0, R.hits.findIndex((p) => p >= ref));
  mostrarHit();
}
function mostrarHit() {
  const p = R.hits[R.hit];
  $('lecCuenta').textContent = (R.hit + 1) + ' de ' + R.hits.length + ' pág.';
  irA(p);
}
$('lecQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('lecQ').blur(); buscarEnDoc(); } });
$('lecSig').addEventListener('click', () => { if (!R.hits.length) return buscarEnDoc(); R.hit = (R.hit + 1) % R.hits.length; mostrarHit(); });
$('lecAnt').addEventListener('click', () => { if (!R.hits.length) return buscarEnDoc(); R.hit = (R.hit - 1 + R.hits.length) % R.hits.length; mostrarHit(); });
window.addEventListener('resize', () => { if (R.pdf && R.zoom === 1) { const p = R.actual; aplicarZoom(); irA(p, true); } });

/* ================= Buscador principal ================= */
let tq;
$('q').addEventListener('input', (e) => {
  $('btnLimpiar').classList.toggle('oculto', !e.target.value);
  clearTimeout(tq); tq = setTimeout(() => { E.q = e.target.value; pintar(); }, 200);
});
$('formBuscar').addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(tq); E.q = $('q').value; $('q').blur(); pintar(); window.scrollTo(0, 0); });
$('btnLimpiar').addEventListener('click', () => { $('q').value = ''; E.q = ''; $('btnLimpiar').classList.add('oculto'); pintar(); $('q').focus(); });
$('btnEditar').addEventListener('click', alternarEdicion);
$('btnAjustes').addEventListener('click', () => irA_pestana('ajustes'));
$('archivoSubir').addEventListener('change', (ev) => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f || !subidaPendiente) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') return aviso('Elija un archivo PDF.');
  const s = subidaPendiente; subidaPendiente = null;
  subirPdf(f, s.area, s.archivo, s.clave);
});

/* ================= Instalación ================= */
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); promptInstalar = e; $('btnInstalar').classList.remove('oculto'); });
$('btnInstalar').addEventListener('click', async () => { if (!promptInstalar) return; promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; $('btnInstalar').classList.add('oculto'); });
const esIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (esIos && !instalada && !leer('bv-aviso-ios', false)) $('avisoIos').classList.remove('oculto');
$('cerrarAviso').addEventListener('click', () => { $('avisoIos').classList.add('oculto'); guardar('bv-aviso-ios', true); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ================= Inicio ================= */
(async function iniciar() {
  pintar();
  await Promise.all([cargarLocales(), cargarTextos()]);
  pintar();
  await cargarRepo(false);
  cargarNovedades();
  cargarAreas();
  cargarIndice();
})();
window.addEventListener('online', () => { cargarRepo(false); cargarIndice(); cargarNovedades(); });
</script>
