<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca Virtual</title>
<meta name="description" content="Leyes, códigos, normas y manuales para consultar en el teléfono, también sin internet.">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --azul:#1D4ED8; --azul-osc:#1E3A8A; --celeste:#DBEAFE; --amarillo:#FACC15;
  --fondo:#F8FAFC; --tarjeta:#FFFFFF; --borde:#E2E8F0; --texto:#0F172A; --suave:#475569; --tenue:#64748B;
  --peligro:#B91C1C; --ok:#047857; --sombra:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
  --lector:#E2E8F0;
}
@media (prefers-color-scheme: dark){
  :root{
    --azul:#60A5FA; --azul-osc:#BFDBFE; --celeste:#1E293B;
    --fondo:#0B1120; --tarjeta:#111827; --borde:#1F2937; --texto:#F1F5F9; --suave:#CBD5E1; --tenue:#94A3B8;
    --peligro:#F87171; --ok:#34D399; --sombra:none; --lector:#020617;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Encabezado */
header{position:sticky;top:0;z-index:5;background:#1D4ED8;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.marca{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.marca img{width:36px;height:36px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.marca h1{font-size:20px;margin:0;font-weight:700;flex:1;letter-spacing:-.2px}
.btn-icono{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center}
header .btn-icono{color:#fff}
header .btn-icono:active{background:rgba(255,255,255,.15)}
.buscador{max-width:720px;margin:12px auto 0;position:relative}
.buscador input{width:100%;height:48px;border:0;border-radius:14px;padding:0 44px 0 44px;background:#fff;color:#0F172A;font-size:17px;outline:none}
.buscador input:focus{box-shadow:0 0 0 3px var(--amarillo)}
.buscador svg{position:absolute;left:14px;top:14px;color:#64748B}
.buscador .limpiar{position:absolute;right:2px;top:2px;color:#64748B}

/* Pestañas */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:752px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--suave);font-size:15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
@media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#0B1120}}

main{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);margin:20px 4px 8px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:8px}

/* Tarjeta de documento */
.doc{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;box-shadow:var(--sombra);padding:4px 4px 4px 0}
.doc .abrir{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 4px 10px 12px;border-radius:12px}
.doc .abrir:active{background:var(--celeste)}
.pdf-ico{flex:none;width:40px;height:48px;border-radius:8px;background:var(--celeste);color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.doc .txt{min-width:0}
.doc .titulo{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.doc .meta{font-size:13px;color:var(--tenue);margin-top:2px}
.doc .meta .ok{color:var(--ok);font-weight:600}
.doc .meta .nuevo{color:var(--azul);font-weight:600}
.doc .btn-icono{color:var(--tenue)}
.doc .btn-icono[aria-pressed="true"]{color:#CA8A04}
.doc .btn-icono.bajado{color:var(--ok)}
.doc .btn-icono:active{background:var(--celeste)}
.doc .btn-icono:disabled{opacity:.5}

.doc.pendiente{background:transparent;box-shadow:none;border-style:dashed}
.pdf-ico.web{background:transparent;border:1.5px dashed var(--borde);color:var(--tenue);font-size:10px}
.doc .btn-icono.subir{color:var(--azul)}
h3.subseccion{font-size:13px;color:var(--tenue);font-weight:600;margin:14px 4px 8px}
.panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.panel p{margin:0;color:var(--suave);font-size:15px}
.panel .url{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--texto);word-break:break-all;background:var(--fondo);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;align-self:stretch}
.panel input{align-self:stretch;height:48px;border:1px solid var(--borde);border-radius:12px;padding:0 12px;background:var(--fondo);font-size:16px}
.panel .fila{display:flex;gap:8px;flex-wrap:wrap}
.panel .ok{color:var(--ok)}
.etiqueta{font-size:14px;font-weight:600;color:var(--texto)}
.aviso-error{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin:8px 0}
.aviso-error p{margin:0;color:var(--peligro);font-size:14px}
.vacio{text-align:center;color:var(--suave);padding:40px 16px}
.vacio strong{display:block;color:var(--texto);font-size:18px;margin-bottom:6px}
.vacio code{background:var(--celeste);padding:2px 6px;border-radius:6px;font-size:14px}
.btn{height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--azul);color:#fff;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px}
@media (prefers-color-scheme: dark){.btn{color:#0B1120}}
.btn.sec{background:var(--tarjeta);color:var(--azul);border:1px solid var(--borde)}
.fila-accion{display:flex;justify-content:center;margin:12px 0 4px}

/* Resultados dentro del texto */
.hit{display:block;width:100%;text-align:left;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:12px 14px}
.hit:active{background:var(--celeste)}
.hit .de{font-size:13px;color:var(--tenue);font-weight:600}
.hit .frag{font-size:15px;margin-top:4px;color:var(--suave)}
.hit mark{background:#FEF08A;color:#0F172A;border-radius:3px;padding:0 1px}
.nota{font-size:13px;color:var(--tenue);margin:8px 4px}

.aviso{max-width:720px;margin:12px auto 0;padding:0 16px}
.aviso div{display:flex;gap:12px;align-items:center;background:var(--celeste);color:var(--texto);border-radius:14px;padding:10px 8px 10px 14px;font-size:14px}
.aviso p{margin:0;flex:1}

/* Lector */
#lector{position:fixed;inset:0;z-index:20;background:var(--lector);display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:calc(env(safe-area-inset-top) + 4px) 4px 4px}
.barra .btn-icono{color:var(--texto)}
.barra .nombre{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buscar-doc{display:flex;align-items:center;gap:4px;background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:6px 4px 6px 12px}
.buscar-doc input{flex:1;min-width:0;height:40px;border:1px solid var(--borde);border-radius:10px;padding:0 12px;background:var(--fondo)}
.buscar-doc .cuenta{font-size:13px;color:var(--tenue);min-width:64px;text-align:center}
#paginas{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;padding:12px 8px}
.pagina{margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);position:relative;max-width:none}
.pagina canvas{display:block;width:100%;height:auto;position:relative;z-index:1;background:#fff}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.pagina .num{position:absolute;inset:auto 0 50% 0;text-align:center;color:#94A3B8;font-size:14px}
.pie{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--tarjeta);border-top:1px solid var(--borde);padding:4px 8px calc(env(safe-area-inset-bottom) + 4px)}
.pie .btn-icono{color:var(--texto)}
.pie .pag{min-width:110px;height:40px;border:1px solid var(--borde);border-radius:10px;background:var(--fondo);font-size:15px;font-weight:600}
.cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:15px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>

<header>
  <div class="marca">
    <img src="icon-192.png" alt="">
    <h1>Biblioteca Virtual</h1>
    <button class="btn-icono oculto" id="btnInstalar" aria-label="Instalar la app">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <button class="btn-icono" id="btnAjustes" aria-label="Compartir y ajustes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
    </button>
    <button class="btn-icono" id="btnRecargar" aria-label="Actualizar la lista">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></svg>
    </button>
  </div>
  <form class="buscador" role="search" onsubmit="return false">
    <label for="q" class="sr">Buscar en la biblioteca</label>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar ley, artículo o palabra" autocomplete="off" enterkeyhint="search">
    <button type="button" class="btn-icono limpiar oculto" id="btnLimpiar" aria-label="Borrar búsqueda">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </form>
</header>

<div class="aviso oculto" id="avisoIos"><div>
  <p>Para instalarla: toque <strong>Compartir</strong> y luego <strong>Agregar a inicio</strong>.</p>
  <button class="btn-icono" id="cerrarAviso" aria-label="Cerrar aviso"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div></div>

<nav class="chips" id="chips" aria-label="Áreas"></nav>
<main id="contenido" aria-live="polite"></main>

<section id="lector" class="oculto" aria-label="Lector de documento">
  <div class="barra">
    <button class="btn-icono" id="lecCerrar" aria-label="Volver a la biblioteca">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="nombre" id="lecTitulo"></div>
    <button class="btn-icono" id="lecCompartir" aria-label="Compartir este documento">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>
    </button>
    <button class="btn-icono" id="lecFav" aria-label="Marcar como favorito" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
    </button>
    <button class="btn-icono" id="lecBuscar" aria-label="Buscar en este documento">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>
  <form class="buscar-doc oculto" id="lecBarraBuscar" onsubmit="return false">
    <label for="lecQ" class="sr">Buscar en este documento</label>
    <input id="lecQ" type="search" placeholder="Buscar en este documento" enterkeyhint="search" autocomplete="off">
    <span class="cuenta" id="lecCuenta"></span>
    <button type="button" class="btn-icono" id="lecAnt" aria-label="Resultado anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button type="button" class="btn-icono" id="lecSig" aria-label="Resultado siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </form>
  <div id="paginas"><div class="cargando" id="lecCargando">Abriendo…</div></div>
  <div class="pie">
    <button class="btn-icono" id="zoomMenos" aria-label="Reducir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button class="pag" id="lecPag" aria-label="Ir a una página">– / –</button>
    <button class="btn-icono" id="zoomMas" aria-label="Ampliar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
</section>

<input type="file" id="archivo" accept="application/pdf,.pdf" multiple class="oculto">
<input type="file" id="archivoSubir" accept="application/pdf,.pdf" class="oculto">
<div id="toast" class="oculto" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ================= Configuración ================= */
// Se detecta solo desde la dirección de GitHub Pages (usuario.github.io/repositorio).
let OWNER = 'jesiahm2324-gif', REPO = 'biblioteca-virtual-';
if (location.hostname.endsWith('.github.io')) {
  OWNER = location.hostname.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  if (seg && !seg.includes('.')) REPO = seg;
}
const AREAS = { codigos: 'Códigos', laboral: 'Laboral', portuario: 'Portuario', pecuario: 'Pecuario', espiritual: 'Espiritual', financiera: 'Financiera' };
const ORDEN = ['codigos', 'laboral', 'portuario', 'pecuario', 'espiritual', 'financiera'];
const DOCS_CACHE = 'bv-docs';

/* ================= Lista de documentos de la biblioteca =================
   Cada entrada aparece en la app aunque todavía no se haya subido el PDF.
   Cuando se sube (con el botón de la app o desde GitHub), pasa a leerse dentro de la app.
   clave: palabras que deben estar en el nombre del PDF subido para reconocerlo.
   enlace: fuente verificada. Sin enlace, la app abre una búsqueda en internet. */
const CATALOGO = [
  { area: 'codigos', archivo: 'Codigo-Penal-Ley-641.pdf', titulo: 'Código Penal (Ley 641)', clave: ['641'] },
  { area: 'codigos', archivo: 'Codigo-Procesal-Penal-Ley-406.pdf', titulo: 'Código Procesal Penal (Ley 406)', clave: ['406'] },
  { area: 'codigos', archivo: 'Codigo-Civil.pdf', titulo: 'Código Civil', clave: ['civil'], no: ['procesal'] },
  { area: 'codigos', archivo: 'Codigo-Procesal-Civil-Ley-902.pdf', titulo: 'Código Procesal Civil (Ley 902)', clave: ['902'] },
  { area: 'codigos', archivo: 'Codigo-Procesal-del-Trabajo-Ley-815.pdf', titulo: 'Código Procesal del Trabajo y de la Seguridad Social (Ley 815)', clave: ['815'], enlace: 'https://nicaragua.justia.com/nacionales/codigos/codigo-procesal-del-trabajo-y-de-la-seguridad-social-de-nicaragua-nov-29-2012/gdoc' },
  { area: 'codigos', archivo: 'Codigo-de-Familia-Ley-870.pdf', titulo: 'Código de Familia (Ley 870)', clave: ['870'], enlace: 'https://nicaragua.justia.com/nacionales/leyes/codigo-de-familia-1-oct-8-2014/gdoc' },
  { area: 'codigos', archivo: 'Codigo-de-Comercio.pdf', titulo: 'Código de Comercio', clave: ['comercio'] },
  { area: 'codigos', archivo: 'Codigo-de-la-Ninez-y-la-Adolescencia-Ley-287.pdf', titulo: 'Código de la Niñez y la Adolescencia (Ley 287)', clave: ['287'] },

  { area: 'laboral', archivo: 'Codigo-del-Trabajo-Ley-185.pdf', titulo: 'Código del Trabajo (Ley 185)', clave: ['185'] },
  { area: 'laboral', archivo: 'Ley-618-Higiene-y-Seguridad-del-Trabajo.pdf', titulo: 'Ley 618, Higiene y Seguridad del Trabajo', clave: ['618'] },
  { area: 'laboral', archivo: 'Ley-476-Servicio-Civil-y-Carrera-Administrativa.pdf', titulo: 'Ley 476, Servicio Civil y Carrera Administrativa', clave: ['476'], no: ['reglamento'], enlace: 'https://www.leybook.com/doc/32870/pdf' },
  { area: 'laboral', archivo: 'Reglamento-Ley-476.pdf', titulo: 'Reglamento de la Ley 476', clave: ['476', 'reglamento'], enlace: 'https://www.leybook.com/doc/32188/pdf' },
  { area: 'laboral', archivo: 'Ley-438-Probidad-de-los-Servidores-Publicos.pdf', titulo: 'Ley 438, Probidad de los Servidores Públicos', clave: ['438'] },
  { area: 'laboral', archivo: 'Ley-822-Concertacion-Tributaria.pdf', titulo: 'Ley 822, Concertación Tributaria (texto vigente)', clave: ['822'], no: ['reglamento'] },
  { area: 'laboral', archivo: 'Reglamento-Ley-822.pdf', titulo: 'Reglamento de la Ley 822', clave: ['822', 'reglamento'], enlace: 'https://www.leybook.com/doc/16532/pdf' },
  { area: 'laboral', archivo: 'Ley-539-Seguridad-Social.pdf', titulo: 'Ley 539, Seguridad Social', clave: ['539'] },
  { area: 'laboral', archivo: 'Reglamento-General-Ley-Seguridad-Social.pdf', titulo: 'Reglamento General de la Ley de Seguridad Social', clave: ['reglamento', 'seguridad', 'social'], enlace: 'https://nicaragua.justia.com/nacionales/decretos-ejecutivos/reglamento-general-de-la-ley-de-seguridad-social-mar-1-1982/gdoc' },

  { area: 'portuario', archivo: 'Ley-431-Transito.pdf', titulo: 'Ley 431, Circulación Vehicular e Infracciones de Tránsito', clave: ['431'], enlace: 'https://www.leybook.com/doc/28081/pdf' },
  { area: 'portuario', archivo: 'Ley-838-General-de-Puertos.pdf', titulo: 'Ley 838, General de Puertos de Nicaragua', clave: ['838'], no: ['reglamento'], enlace: 'https://www.leybook.com/doc/25962/pdf' },
  { area: 'portuario', archivo: 'Reglamento-Ley-838.pdf', titulo: 'Reglamento de la Ley 838', clave: ['838', 'reglamento'], enlace: 'https://www.leybook.com/doc/26169/pdf' },

// El área es la carpeta donde está el PDF, esté donde esté en el repositorio:
// documentos/portuario/x.pdf y documentos/documentos/Portuario/x.pdf van a "portuario".
function areaDeRuta(path) {
  const partes = path.split('/');
  if (partes.length < 2) return 'otros';
  const carpeta = plegar(partes[partes.length - 2]).replace(/[^a-z0-9]+/g, '');
  if (!carpeta || carpeta === 'documentos' || carpeta === 'documento') return 'otros';
  if (carpeta.startsWith('codigo')) return 'codigos';
  if (carpeta.startsWith('laboral')) return 'laboral';
  if (carpeta.startsWith('portuari') || carpeta.startsWith('puerto')) return 'portuario';
  if (carpeta.startsWith('pecuari') || carpeta.startsWith('ganad')) return 'pecuario';
  if (carpeta.startsWith('espiritu')) return 'espiritual';
  if (carpeta.startsWith('financ') || carpeta.startsWith('finanza')) return 'financiera';
  return carpeta;
}
let RAMA = leer('bv-rama', 'main');
// Los PDF se leen directo de GitHub: un archivo recién subido se puede abrir al instante.
const urlArchivo = (path) => `https://raw.githubusercontent.com/${OWNER}/${REPO}/${RAMA}/` + path.split('/').map(encodeURIComponent).join('/');
function docDeRepo(path, size, sha) {
  const nombre = path.split('/').pop();
  const area = areaDeRuta(path);
  const c = CATALOGO.find((x) => x.area === area && x.archivo.toLowerCase() === nombre.toLowerCase());
  return { id: 'repo:' + path, path, titulo: c ? c.titulo : titulo(nombre), area, url: urlArchivo(path), size, sha };
}
async function listarRepo() {
  let r, rama;
  for (rama of ['main', 'master']) {
    r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${rama}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status !== 404) break;
  }
  if (r.status === 404 || r.status === 409) return { docs: [], vacio: true };
  if (r.status === 403 || r.status === 429) throw new Error('GitHub limitó las consultas por un rato. Intente en unos minutos.');
  if (!r.ok) throw new Error('No se pudo leer la lista (' + r.status + ').');
  RAMA = rama; guardar('bv-rama', rama);
  const data = await r.json();
  const docs = (data.tree || [])
    .filter((t) => t.type === 'blob' && /\.pdf$/i.test(t.path))
    .map((t) => docDeRepo(t.path, t.size, t.sha));
  return { docs, vacio: false };
}
// Documentos de la lista que todavía no están subidos.
function reconoce(c, d) {
  if (d.area !== c.area) return false;
  const t = ' ' + plegar(d.titulo + ' ' + d.path.split('/').pop()).replace(/[^a-z0-9]+/g, ' ') + ' ';
  return c.clave.every((w) => t.includes(' ' + w + ' ')) && !(c.no || []).some((w) => t.includes(' ' + w + ' '));
}
const pendientes = () => CATALOGO.filter((c) => !E.docs.some((d) => d.path && reconoce(c, d)));
async function cargarRepo(forzar) {
  const cache = leer('bv-lista', null);
  if (cache) { E.docs = cache.docs; E.estadoRepo = cache.vacio ? 'vacio' : 'ok'; pintar(); }
  if (!forzar && cache && Date.now() - cache.t < 5 * 60 * 1000) return;
  if (!navigator.onLine) { if (!cache) { E.estadoRepo = 'error'; E.errorRepo = 'Sin conexión. Conéctese una vez para cargar la lista.'; pintar(); } return; }
  try {
    const res = await listarRepo();
    E.docs = res.docs; E.estadoRepo = res.vacio ? 'vacio' : 'ok';
    guardar('bv-lista', { t: Date.now(), docs: res.docs, vacio: res.vacio });
    if (forzar) aviso('Lista actualizada: ' + res.docs.length + ' documentos');
  } catch (e) {

}

async function extraerTexto(pdf, progreso) {
  const pages = [];

    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    pages.push(tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' '));
    if (progreso) progreso(i, pdf.numPages);

}

}

  const f = ev.target.files[0]; ev.target.value = '';
  if (!f || !subidaPendiente) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') return aviso('Elija un archivo PDF.');
  const s = subidaPendiente; subidaPendiente = null;
  subirPdf(f, s.area, s.archivo, s.clave);
});

/* ================= Instalación ================= */
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); promptInstalar = e; $('btnInstalar').classList.remove('oculto'); });
$('btnInstalar').addEventListener('click', async () => { if (!promptInstalar) return; promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; $('btnInstalar').classList.add('oculto'); });
const esIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (esIos && !instalada && !leer('bv-aviso-ios', false)) $('avisoIos').classList.remove('oculto');
$('cerrarAviso').addEventListener('click', () => { $('avisoIos').classList.add('oculto'); guardar('bv-aviso-ios', true); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ================= Inicio ================= */
(async function iniciar() {
  pintar();
  await Promise.all([cargarLocales(), cargarTextos()]);
  pintar();
  cargarRepo(false);
})();
window.addEventListener('online', () => cargarRepo(false));
</script>
